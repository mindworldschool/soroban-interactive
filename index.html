<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta name="robots" content="noindex">
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DVHX3G2VJV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-DVHX3G2VJV', {
    'cookie_flags': 'SameSite=None;Secure'
  });
</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Abacus Trainer - MindWorld School</title>

    <!-- Иконка -->
    <link rel="icon" type="image/png" href="./assets/images/logo.png" />

    <!-- Общая оболочка публичных тренажёров: шапка, языки, шрифты, цвета -->
    <link rel="stylesheet" href="/trainer-shell/shell.v1.css" />
    <link rel="stylesheet" href="./styles/main.css?v=2" />
    <script src="/trainer-shell/shell.v1.js"></script>
  </head>

  <body>
    <!-- Сюда оболочка вставит шапку (лого, название, UA / EN / RU / ES) -->
    <div id="mw-header"></div>

    <!-- Основной контент -->
    <main id="app" class="app-main" role="main">
      <div class="screen">
        <!-- Контейнер абакуса -->
        <div id="abacus-container" class="abacus-container"></div>

        <!-- Кнопки управления -->
        <div class="screen__footer">
          <button id="resetBtn" class="btn btn--primary">Скинути</button>
          <button id="configBtn" class="btn btn--secondary">⚙️ Налаштування</button>
        </div>
      </div>
    </main>

    <!-- Футер -->
    <footer id="appFooter" class="app-footer">MindWorld School © 2026</footer>

    <!-- Меню настроек (скрыто по умолчанию) -->
    <div id="config-menu" class="config-overlay" style="display: none;">
      <div class="config-modal">
        <h2 class="config-modal__title">Налаштування</h2>
        
        <div class="form-group">
          <label class="form-group__label">
            <input type="checkbox" id="showDigits" />
            <span>Показати цифри</span>
          </label>
        </div>

        <div class="form-group">
          <label class="form-group__label" for="sizeSelect">Розмір соробана</label>
          <select id="sizeSelect" class="form-group__select">
            <option value="9">Маленький (9 стержнів)</option>
            <option value="13" selected>Стандарт (13 стержнів)</option>
            <option value="17">Великий (17 стержнів)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-group__label" for="notchOffsetSelect">Позиція засічок</label>
          <select id="notchOffsetSelect" class="form-group__select">
            <option value="0" selected>Стандарт (3, 6, 9... справа)</option>
            <option value="1">Зсув вліво (2, 5, 8... справа)</option>
            <option value="2">Зсув вправо (1, 4, 7... справа)</option>
          </select>
        </div>

        <div class="config-modal__footer">
          <button id="closeConfig" class="btn btn--primary">Закрити</button>
        </div>
      </div>
    </div>

    <!-- Шапка и язык — из общей оболочки: ?lang= → сохранённый выбор → браузер → украинский.
         Выбранный язык передаём в модули через window.APP_LANG, смену — событием mw:langchange -->
    <script>
      MWShell.init({
        title: "Abacus Trainer",
        tagline: {
          ua: "Інтерактивний тренажер абакуса",
          en: "Interactive Abacus Trainer",
          ru: "Интерактивный тренажер абакуса",
          es: "Entrenador Interactivo de Ábaco"
        },
        docTitle: "Abacus Trainer — MindWorld School",
        ukrainianCode: "ua",
        onLangChange: function (lang) { window.APP_LANG = lang; }
      });
    </script>

    <!-- Основной JS -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
